name: Build and Deploy to AWS

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: GitHub Environment to deploy to
        required: true
        type: choice
        options:
          - development
          - production

concurrency:
  group: aws-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment || (github.ref == 'refs/heads/main' && 'production' || 'development') }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
